version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: streetdom-db
    restart: always
    environment:
      POSTGRES_USER: ${DATASOURCE_USER}
      POSTGRES_PASSWORD: ${DATASOURCE_PASSWORD}
      POSTGRES_DB: ${DATASOURCE_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATASOURCE_USER} -d ${DATASOURCE_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  valhalla:
    image: ghcr.io/valhalla/valhalla:latest
    container_name: streetdom-valhalla
    volumes:
      - ./valhalla:/data/valhalla
    ports:
      - "8002:8002"
    command: >
      sh -c "
        mkdir -p /data/valhalla/tiles;
        if [ -z \"$(ls -A /data/valhalla/tiles 2>/dev/null)\" ]; then
          echo 'No Valhalla tiles found. Generating tiles...';
          valhalla_build_tiles -c /data/valhalla/valhalla.json /data/valhalla/osm/barcelona.osm.pbf;
        else
          echo 'Valhalla tiles already exist. Skipping tile generation.';
        fi;
        valhalla_service /data/valhalla/valhalla.json
      "
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8002/status || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  backend:
    build: ../backend
    container_name: streetdom-backend
    depends_on:
      postgres:
        condition: service_healthy
      valhalla:
        condition: service_healthy
    restart: on-failure:3
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DATASOURCE_URL: ${DATASOURCE_URL}
      DATASOURCE_USERNAME: ${DATASOURCE_USER}
      DATASOURCE_PASSWORD: ${DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      JWT_SESSION_MAX_EXPIRATION: ${JWT_SESSION_MAX_EXPIRATION}
      VALHALLA_URL: ${VALHALLA_URL}

  redis:
    image: redis:8-alpine
    container_name: streetdom-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: