version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: streetdom-db
    restart: always
    environment:
      POSTGRES_USER: ${DATASOURCE_USER}
      POSTGRES_PASSWORD: ${DATASOURCE_PASSWORD}
      POSTGRES_DB: ${DATASOURCE_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATASOURCE_USER} -d ${DATASOURCE_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  valhalla:
    image: ghcr.io/valhalla/valhalla:latest
    container_name: streetdom-valhalla
    volumes:
      - ./valhalla:/data/valhalla
    ports:
      - "8002:8002"
    command: >
      valhalla_service
      /data/valhalla/valhalla.json

  backend:
    build: ../backend
    container_name: streetdom-backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DATASOURCE_URL: ${DATASOURCE_URL}
      DATASOURCE_USERNAME: ${DATASOURCE_USER}
      DATASOURCE_PASSWORD: ${DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      JWT_SESSION_MAX_EXPIRATION: ${JWT_SESSION_MAX_EXPIRATION}
      VALHALLA_URL: ${VALHALLA_URL}

volumes:
  postgres_data: